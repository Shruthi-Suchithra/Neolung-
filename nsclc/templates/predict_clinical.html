{% load static %}
{% include 'header.html' %}

<div class="container" style="margin-top: 50px; margin-bottom: 50px;">
    <h2>Clinical Data NSCLC Detection</h2>
    <p>Enter patient clinical data to estimate NSCLC risk/presence.</p>

    <form method="post">
        {% csrf_token %}

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="age" class="form-label">Age</label>
                <input type="number" name="age" id="age" class="form-control" required min="1" max="120">
            </div>

            <div class="col-md-6 mb-3">
                <label for="gender" class="form-label">Gender</label>
                <select name="gender" id="gender" class="form-select" required>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label for="smoking_status" class="form-label">Smoking Status</label>
            <select name="smoking_status" id="smoking_status" class="form-select" required>
                <option value="Never">Never</option>
                <option value="Former">Former</option>
                <option value="Current">Current</option>
            </select>
        </div>

        <h4>Genetic Mutations</h4>
        <div class="row">
            <div class="col-md-3 mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="egfr" id="egfr">
                    <label class="form-check-label" for="egfr">EGFR Mutation</label>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="alk" id="alk">
                    <label class="form-check-label" for="alk">ALK Rearrangement</label>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="kras" id="kras">
                    <label class="form-check-label" for="kras">KRAS Mutation</label>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="ros1" id="ros1">
                    <label class="form-check-label" for="ros1">ROS1 Rearrangement</label>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary mt-3">Predict Risk</button>
    </form>
</div>

{% include 'footer.html' %}
